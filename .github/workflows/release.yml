name: Release CDW Preço CNPJ

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para build manual (ex: 1.3.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver versão
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict --no-check-publish

      - name: Instalar dependências de produção
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Montar diretório de build
        run: |
          mkdir -p build/wc-smart-registration-pricing
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='build' \
            --exclude='tests' \
            --exclude='RELEASE_BODY.md' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            --exclude='.DS_Store' \
            ./ build/wc-smart-registration-pricing/

      - name: Empacotar zip
        id: zip
        run: |
          ZIP_NAME="wc-smart-registration-pricing-${{ steps.version.outputs.version }}.zip"
          cd build && zip -rq "../$ZIP_NAME" wc-smart-registration-pricing
          cd ..
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | tail -10

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CDW Preço CNPJ ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body_path: RELEASE_BODY.md
          files: ${{ steps.zip.outputs.zip }}

      - name: Gerar info.json para o update server
        run: |
          python3 - <<'PY'
          import json, re, os, datetime, html

          version = os.environ['VERSION']
          changelog_html = ''
          for path in ('CHANGELOG.md', 'RELEASE_BODY.md'):
              if os.path.exists(path):
                  with open(path, encoding='utf-8') as f:
                      text = f.read()
                  m = re.search(r'^## \[?' + re.escape(version) + r'\]?.*?(?=^## |\Z)', text, re.M | re.S)
                  if m:
                      section = m.group(0)
                  elif path == 'RELEASE_BODY.md':
                      section = text
                  else:
                      continue
                  lines = section.splitlines()
                  out, in_list = [], False
                  for ln in lines:
                      if ln.startswith('## '):
                          if in_list: out.append('</ul>'); in_list = False
                          out.append('<h4>' + html.escape(ln[3:]).replace('[', '').replace(']', '') + '</h4>')
                      elif ln.startswith('### '):
                          if in_list: out.append('</ul>'); in_list = False
                          out.append('<h5>' + html.escape(ln[4:]) + '</h5>')
                      elif re.match(r'^\s*[-*]\s+', ln):
                          if not in_list: out.append('<ul>'); in_list = True
                          item = re.sub(r'^\s*[-*]\s+', '', ln)
                          item = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', html.escape(item))
                          item = re.sub(r'`([^`]+?)`', r'<code>\1</code>', item)
                          out.append('<li>' + item + '</li>')
                      elif ln.strip() == '':
                          if in_list: out.append('</ul>'); in_list = False
                  if in_list: out.append('</ul>')
                  changelog_html = '\n'.join(out)
                  break

          info = {
              "name": "CDW Preço CNPJ",
              "slug": "wc-smart-registration-pricing",
              "version": version,
              "homepage": "https://www.cdw.com.br",
              "author": "CDW",
              "requires": "6.0",
              "tested": "6.7",
              "requires_php": "8.0",
              "download_url": f"https://plugins.cdwtech.com.br/wc-smart-registration-pricing/wc-smart-registration-pricing-{version}.zip",
              "last_updated": datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S'),
              "sections": {
                  "description": "Cadastro CPF/CNPJ na Minha Conta e preços diferenciados para clientes CNPJ no WooCommerce. Complementar ao Brazilian Market.",
                  "changelog": changelog_html or f"<p>Versão {version}.</p>"
              }
          }

          with open('info.json', 'w', encoding='utf-8') as f:
              json.dump(info, f, ensure_ascii=False, indent=4)
          PY
          cat info.json
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Configurar SSH para o update server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publicar zip + info.json no plugins.cdwtech.com.br
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          scp -i ~/.ssh/deploy_key -P 22 -o StrictHostKeyChecking=yes \
            "$ZIP" info.json \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_REMOTE_PATH/"
          echo "Arquivos publicados em $DEPLOY_REMOTE_PATH"

      - name: Validar manifest acessível
        run: |
          sleep 3
          curl -sSf "https://plugins.cdwtech.com.br/wc-smart-registration-pricing/info.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print('manifest live: version =', d['version'])"
          curl -sSfI "https://plugins.cdwtech.com.br/wc-smart-registration-pricing/${{ steps.zip.outputs.zip }}" | head -3
